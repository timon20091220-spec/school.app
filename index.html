<!doctype html>
<html lang="ko" style="background:#f6f4ef">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>배문고 학교생활 앱</title>
  <link rel="manifest" href="./manifest.webmanifest?v=1137">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f6f4ef;color:#111827}
    .boot{min-height:100dvh;display:grid;place-items:center;padding:24px}
    .boot-card{width:min(390px,90vw);padding:25px 22px;border-radius:25px;background:#fff;box-shadow:0 18px 55px rgba(17,24,39,.12);text-align:center}
    .boot-logo{width:62px;height:62px;border-radius:20px;margin:0 auto 15px;display:grid;place-items:center;background:#111827;color:#fff;font-size:27px;font-weight:900}
    .boot h1{margin:0 0 8px;font-size:21px}.boot p{margin:0;color:#667085;font-size:14px;line-height:1.55}
    .boot-spinner{width:32px;height:32px;margin:18px auto 0;border-radius:50%;border:3px solid #e5e7eb;border-top-color:#111827;animation:spin .68s linear infinite}
    .boot-error{display:none;margin-top:14px!important;color:#b42318!important}
    .boot-actions{display:none;gap:8px;justify-content:center;margin-top:16px}
    .boot-actions button{border:0;border-radius:13px;padding:11px 15px;font-weight:800;cursor:pointer}
    .boot-retry{background:#111827;color:#fff}.boot-clear{background:#eef0f3;color:#111827}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="boot" id="bootScreen">
    <section class="boot-card">
      <div class="boot-logo">배</div>
      <h1>배문고 앱을 여는 중</h1>
      <p id="bootStatus">잠시만 기다려주세요.</p>
      <div class="boot-spinner" id="bootSpinner"></div>
      <p class="boot-error" id="bootError"></p>
      <div class="boot-actions" id="bootActions">
        <button class="boot-retry" id="bootRetry" type="button">다시 시도</button>
        <button class="boot-clear" id="bootClear" type="button">캐시 초기화</button>
      </div>
    </section>
  </main>

  <script>
  (() => {
    'use strict';

    const VERSION = '1137';
    const BASE_CACHE_KEY = 'baemoon-base-index-static-v1';
    const LEGACY_CACHE_KEYS = [
      'baemoon-base-index-68b50607-v1136',
      'baemoon-base-index-68b50607-v1135',
      'baemoon-base-index-68b50607-v1134',
      'baemoon-base-index-68b50607-v1133'
    ];
    const SOURCES = [
      'https://cdn.jsdelivr.net/gh/timon20091220-spec/school.app@68b50607fcd2ce5a233be1c03f091bccda420f9b/index.html',
      'https://fastly.jsdelivr.net/gh/timon20091220-spec/school.app@68b50607fcd2ce5a233be1c03f091bccda420f9b/index.html',
      'https://raw.githubusercontent.com/timon20091220-spec/school.app/68b50607fcd2ce5a233be1c03f091bccda420f9b/index.html'
    ];

    const status = document.getElementById('bootStatus');
    const spinner = document.getElementById('bootSpinner');
    const error = document.getElementById('bootError');
    const actions = document.getElementById('bootActions');
    const retry = document.getElementById('bootRetry');
    const clear = document.getElementById('bootClear');

    let starting = false;

    function prepare(html) {
      let output = String(html || '');
      if (!/<!doctype html|<html/i.test(output) || output.length < 10000) {
        throw new Error('기본 화면 파일이 올바르지 않습니다.');
      }
      return output
        .replace(/styles\.css(?:\?v=\d+)?/g, 'styles.css?v=' + VERSION)
        .replace(/app-v1127\.js(?:\?v=\d+)?/g, 'app-v1127.js?v=' + VERSION)
        .replace(/firebase-runtime-v1127\.js(?:\?v=\d+)?/g, 'firebase-runtime-v1127.js?v=' + VERSION)
        .replace(/sw-v1127\.js(?:\?v=\d+)?/g, 'sw-v1127.js?v=' + VERSION)
        .replace(/manifest\.webmanifest(?:\?v=\d+)?/g, 'manifest.webmanifest?v=' + VERSION)
        .replace(/v11\.27/g, 'v11.37')
        .replace(/행사를<br\s*\/?>(?:\s*)선택하세요\./g, '배문고등학교<br>행사')
        .replace(/공개된 행사/g, '행사')
        .replace(/회차 전체 정원/g, '기본 예약 정원')
        .replace(/정원이 찬 뒤 대기번호를 받을 수 있습니다\./g, '예약이 완료되면 해당 시간의 번호가 바로 발급됩니다.');
    }

    function readCachedBase() {
      for (const key of [BASE_CACHE_KEY, ...LEGACY_CACHE_KEYS]) {
        try {
          const value = localStorage.getItem(key);
          if (value && value.length > 10000 && /<!doctype html|<html/i.test(value)) {
            if (key !== BASE_CACHE_KEY) {
              try { localStorage.setItem(BASE_CACHE_KEY, value); } catch {}
            }
            return value;
          }
        } catch {}
      }
      return '';
    }

    function saveCachedBase(html) {
      try { localStorage.setItem(BASE_CACHE_KEY, html); } catch {}
    }

    async function fetchSource(url, timeoutMs = 3800) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, {
          mode: 'cors',
          cache: 'force-cache',
          signal: controller.signal
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const html = await response.text();
        if (html.length < 10000) throw new Error('파일 크기 오류');
        return html;
      } finally {
        clearTimeout(timer);
      }
    }

    async function fetchNetworkBase() {
      const attempts = SOURCES.map(url => fetchSource(url));
      if (typeof Promise.any === 'function') return Promise.any(attempts);

      return new Promise((resolve, reject) => {
        let failed = 0;
        let lastError = null;
        attempts.forEach(promise => promise.then(resolve).catch(err => {
          failed += 1;
          lastError = err;
          if (failed === attempts.length) reject(lastError || new Error('불러오기 실패'));
        }));
      });
    }

    function scriptSpec(node) {
      return {
        src: node.getAttribute('src') || '',
        text: node.textContent || '',
        attrs: [...node.attributes]
          .filter(attr => attr.name !== 'src')
          .map(attr => [attr.name, attr.value])
      };
    }

    async function appendScript(spec) {
      const script = document.createElement('script');
      for (const [name, value] of spec.attrs) script.setAttribute(name, value);

      const type = String(script.getAttribute('type') || '').toLowerCase();
      const isModule = type === 'module';

      if (spec.src) {
        await new Promise((resolve, reject) => {
          script.addEventListener('load', resolve, { once: true });
          script.addEventListener('error', () => reject(new Error('앱 파일 로드 실패: ' + spec.src)), { once: true });
          script.src = spec.src;
          document.body.appendChild(script);
        });
        return;
      }

      if (isModule) {
        await new Promise((resolve, reject) => {
          script.addEventListener('load', resolve, { once: true });
          script.addEventListener('error', () => reject(new Error('앱 모듈 실행 실패')), { once: true });
          script.textContent = spec.text;
          document.body.appendChild(script);
        });
        return;
      }

      script.textContent = spec.text;
      document.body.appendChild(script);
    }

    function waitForStyles(timeoutMs = 2200) {
      const styles = [...document.querySelectorAll('link[rel="stylesheet"]')];
      return Promise.all(styles.map(link => {
        if (link.sheet) return Promise.resolve();
        return new Promise(resolve => {
          let done = false;
          const finish = () => {
            if (done) return;
            done = true;
            resolve();
          };
          link.addEventListener('load', finish, { once: true });
          link.addEventListener('error', finish, { once: true });
          setTimeout(finish, timeoutMs);
        });
      }));
    }

    async function mount(baseHtml) {
      const parsed = new DOMParser().parseFromString(prepare(baseHtml), 'text/html');
      if (!parsed || !parsed.head || !parsed.body) throw new Error('앱 화면 구성 실패');

      const scripts = [...parsed.querySelectorAll('script')].map(scriptSpec);
      parsed.querySelectorAll('script').forEach(node => node.remove());

      const headNodes = [...parsed.head.childNodes].map(node => document.importNode(node, true));
      const bodyNodes = [...parsed.body.childNodes].map(node => document.importNode(node, true));

      document.head.replaceChildren(...headNodes);
      document.body.replaceChildren(...bodyNodes);

      await waitForStyles();

      // 로그인 화면은 앱 스크립트가 모두 끝나기 전이라도 즉시 보여줍니다.
      document.documentElement.style.visibility = 'visible';
      document.documentElement.dataset.baemoonHydrated = '1';

      for (const spec of scripts) {
        try {
          await appendScript(spec);
        } catch (scriptError) {
          console.error('[Baemoon boot] script error', scriptError);
          // 화면 자체는 유지하고 다음 스크립트를 시도합니다.
        }
      }
    }

    async function refreshCacheInBackground() {
      try {
        const html = await fetchNetworkBase();
        saveCachedBase(html);
      } catch {}
    }

    async function start() {
      if (starting) return;
      starting = true;
      error.style.display = 'none';
      actions.style.display = 'none';
      spinner.style.display = 'block';
      status.textContent = '잠시만 기다려주세요.';

      try {
        const cached = readCachedBase();
        if (cached) {
          status.textContent = '저장된 화면을 여는 중입니다.';
          await mount(cached);
          refreshCacheInBackground();
          return;
        }

        status.textContent = '처음 한 번만 화면을 준비하고 있습니다.';
        const networkHtml = await fetchNetworkBase();
        saveCachedBase(networkHtml);
        await mount(networkHtml);
      } catch (bootError) {
        spinner.style.display = 'none';
        status.textContent = '앱을 열지 못했습니다.';
        error.textContent = '인터넷 연결을 확인하고 다시 시도해주세요. (' + (bootError?.message || '불러오기 실패') + ')';
        error.style.display = 'block';
        actions.style.display = 'flex';
        starting = false;
      }
    }

    retry.addEventListener('click', start);
    clear.addEventListener('click', () => {
      try {
        localStorage.removeItem(BASE_CACHE_KEY);
        LEGACY_CACHE_KEYS.forEach(key => localStorage.removeItem(key));
      } catch {}
      location.reload();
    });

    start();
  })();
  </script>
</body>
</html>
